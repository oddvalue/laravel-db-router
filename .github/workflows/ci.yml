name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug
          extensions: mbstring, dom, sqlite3
          ini-values: memory_limit=512M
          tools: composer:v2
      - name: Validate composer.json and composer.lock
        run: composer validate --no-interaction
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run tests (Pest)
        run: vendor/bin/pest
      - name: Generate coverage (only on main, PHP 8.3)
        if: github.ref == 'refs/heads/main' && matrix.php == '8.3' && github.event_name == 'push'
        run: |
      - name: Execute tests
        run: vendor/bin/pest --coverage-cobertura coverage.xml

      - name: Upload coverage
        uses: gaelgirodon/ci-badges-action@v1
        if: "github.ref == 'refs/heads/main'"
        with:
          gist-id: 1b9a63d1adac98e446b9bb5b591d3e81
          token: ${{ secrets.GIST_TOKEN }}
